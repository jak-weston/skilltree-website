<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradient for the glowing effect -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#blueGlow)" opacity="0.3"/>
  
  <!-- Pushup stick figure with glow -->
  <g filter="url(#glow)" fill="url(#blueGlow)">
    <!-- Arms (supporting position) -->
    <path d="M35 60 L35 75 L45 75 L45 60 Z" rx="2"/>
    <path d="M55 60 L55 75 L65 75 L65 60 Z" rx="2"/>
    
    <!-- Body (straight line) -->
    <path d="M40 45 L40 60 L60 60 L60 45 Z" rx="1"/>
    
    <!-- Head (rounded) -->
    <path d="M45 35 Q50 30 55 35 L55 45 L45 45 Z" rx="3"/>
    
    <!-- Legs (straight) -->
    <path d="M42 60 L42 75 L48 75 L48 60 Z" rx="1"/>
    <path d="M52 60 L52 75 L58 75 L58 60 Z" rx="1"/>
  </g>
  
  <!-- Additional glow layers for enhanced effect -->
  <g opacity="0.6" fill="url(#blueGlow)">
    <path d="M35 60 L35 75 L45 75 L45 60 Z" rx="2"/>
    <path d="M55 60 L55 75 L65 75 L65 60 Z" rx="2"/>
    <path d="M40 45 L40 60 L60 60 L60 45 Z" rx="1"/>
    <path d="M45 35 Q50 30 55 35 L55 45 L45 45 Z" rx="3"/>
    <path d="M42 60 L42 75 L48 75 L48 60 Z" rx="1"/>
    <path d="M52 60 L52 75 L58 75 L58 60 Z" rx="1"/>
  </g>
</svg>